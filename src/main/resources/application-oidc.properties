spring.security.oauth2.client.registration.mesarol.provider=mesarol
spring.security.oauth2.client.registration.mesarol.client-id=${OIDC_CLIENT_ID:mesarol}
spring.security.oauth2.client.registration.mesarol.client-secret=${OIDC_CLIENT_SECRET}
spring.security.oauth2.client.registration.mesarol.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.mesarol.scope=openid,profile,email
spring.security.oauth2.client.provider.mesarol.issuer-uri=${OIDC_ISSUER}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=${OIDC_AUDIENCE:mesarol}
