apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesarol
  namespace: mesarol
spec:
  replicas: 1
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app: mesarol
  template:
    metadata:
      labels:
        app: mesarol
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: app
          image: ghcr.io/replace-me/mesa-rol:bootstrap
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: oidc
            - name: DATABASE_URL
              value: jdbc:postgresql://postgres:5432/mesarol
          envFrom:
            - secretRef:
                name: mesarol-config
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 36
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
