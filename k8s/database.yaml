apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mesarol
spec:
  clusterIP: None
  selector:
    app: mesarol-postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mesarol
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: mesarol-postgres
  template:
    metadata:
      labels:
        app: mesarol-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: mesarol
            - name: POSTGRES_USER
              value: mesarol
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mesarol-config
                  key: DATABASE_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, mesarol, -d, mesarol]
            periodSeconds: 5
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
