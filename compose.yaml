services:
  identity:
    image: quay.io/keycloak/keycloak:26.8.2
    command: [start-dev, --import-realm]
    environment:
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Define OIDC_CLIENT_SECRET en .env}
      MESAROL_DEMO_ORGANIZER_PASSWORD: ${MESAROL_DEMO_ORGANIZER_PASSWORD:?Define la clave de la directora}
      MESAROL_DEMO_PLAYER_PASSWORD: ${MESAROL_DEMO_PLAYER_PASSWORD:?Define la clave del jugador}
      MESAROL_DEMO_OTHER_PASSWORD: ${MESAROL_DEMO_OTHER_PASSWORD:?Define la clave del segundo jugador}
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./infra/keycloak/mesarol-realm.json:/opt/keycloak/data/import/mesarol-realm.json:ro
      - keycloak_data:/opt/keycloak/data
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: mesarol
      POSTGRES_USER: mesarol
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesarol -d mesarol"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  keycloak_data:
